<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Helvetica, Arial, sans-serif">

  <!-- Panel A: right after "drop it" -->
  <g>
    <text x="220" y="26" text-anchor="middle" font-size="13" fill="#555">right after you say "drop it"</text>

    <rect x="60" y="55" width="120" height="65" rx="8" fill="#f0743a" stroke="#c95a24" stroke-width="2"/>
    <text x="120" y="93" text-anchor="middle" font-size="16" fill="#fff">"no"</text>

    <rect x="240" y="45" width="140" height="110" rx="8" fill="#f2f2f2" stroke="#ccc"/>
    <g stroke="#ddd" stroke-width="4">
      <line x1="256" y1="68" x2="364" y2="68"/>
      <line x1="256" y1="90" x2="364" y2="90"/>
      <line x1="256" y1="112" x2="330" y2="112"/>
      <line x1="256" y1="134" x2="364" y2="134"/>
    </g>

    <text x="220" y="185" text-anchor="middle" font-size="11.5" fill="#888">freshest voice wins, for now</text>
  </g>

  <!-- Panel B: a few turns later -->
  <g>
    <text x="680" y="26" text-anchor="middle" font-size="13" fill="#555">a few turns later</text>

    <rect x="580" y="70" width="90" height="50" rx="8" fill="#f2f2f2" stroke="#ccc" stroke-width="1.5"/>
    <text x="625" y="100" text-anchor="middle" font-size="13" fill="#bbb">"no"</text>

    <rect x="710" y="40" width="150" height="120" rx="8" fill="#e4e4e4" stroke="#999" stroke-width="2"/>
    <g stroke="#999" stroke-width="4">
      <line x1="726" y1="64" x2="844" y2="64"/>
      <line x1="726" y1="87" x2="844" y2="87"/>
      <line x1="726" y1="110" x2="805" y2="110"/>
      <line x1="726" y1="133" x2="844" y2="133"/>
      <line x1="726" y1="152" x2="790" y2="152"/>
    </g>

    <text x="680" y="185" text-anchor="middle" font-size="11.5" fill="#888">only the approach still holds actual lines</text>
  </g>
</svg>
