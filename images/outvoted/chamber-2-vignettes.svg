<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Helvetica, Arial, sans-serif">

  <!-- Panel 1: read-edit-read -->
  <g transform="translate(40,0)">
    <text x="130" y="16" text-anchor="middle" font-size="11.5" fill="#555">read &#8594; edit &#8594; read</text>
    <rect x="23" y="30" width="60" height="32" fill="#c9dcf5" stroke="#a9c2e6"/>
    <rect x="97" y="30" width="60" height="32" fill="#a9c2e6" stroke="#7ea3d6"/>
    <rect x="171" y="30" width="66" height="32" fill="#5b84c4" stroke="#3f6bab"/>
    <line x1="53"  y1="62" x2="130" y2="138" stroke="#a9c2e6" stroke-width="3"/>
    <line x1="127" y1="62" x2="130" y2="138" stroke="#7ea3d6" stroke-width="3"/>
    <line x1="204" y1="62" x2="130" y2="138" stroke="#5b84c4" stroke-width="3.3"/>
    <circle cx="130" cy="150" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="130" y="180" text-anchor="middle" font-size="11" fill="#333">next token</text>
  </g>

  <!-- Panel 2: email -->
  <g transform="translate(320,0)">
    <text x="130" y="16" text-anchor="middle" font-size="11.5" fill="#555">one draft, two corrections</text>
    <rect x="16" y="30" width="150" height="32" fill="#e4e4e4" stroke="#999"/>
    <rect x="180" y="30" width="25" height="32" fill="#f0743a" stroke="#c95a24"/>
    <rect x="219" y="30" width="25" height="32" fill="#f0743a" stroke="#c95a24"/>
    <line x1="91"  y1="62" x2="130" y2="138" stroke="#999" stroke-width="11"/>
    <line x1="192" y1="62" x2="130" y2="138" stroke="#c95a24" stroke-width="2"/>
    <line x1="231" y1="62" x2="130" y2="138" stroke="#c95a24" stroke-width="2"/>
    <circle cx="130" cy="150" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="130" y="180" text-anchor="middle" font-size="11" fill="#333">next token</text>
  </g>

  <!-- Panel 3: abandoned approach -->
  <g transform="translate(600,0)">
    <text x="130" y="16" text-anchor="middle" font-size="11.5" fill="#555">one approach, one retraction</text>
    <rect x="45" y="30" width="140" height="32" fill="#e4e4e4" stroke="#999"/>
    <rect x="199" y="30" width="16" height="32" fill="#f0743a" stroke="#c95a24"/>
    <line x1="115" y1="62" x2="130" y2="138" stroke="#999" stroke-width="10"/>
    <line x1="207" y1="62" x2="130" y2="138" stroke="#c95a24" stroke-width="1.5"/>
    <circle cx="130" cy="150" r="12" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="130" y="180" text-anchor="middle" font-size="11" fill="#333">next token</text>
  </g>
</svg>
