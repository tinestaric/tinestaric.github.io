<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="manyTokensD" width="10" height="50" patternUnits="userSpaceOnUse">
      <rect width="10" height="50" fill="#f6f6f6"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="#d5d5d5" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Panel A: relevant token vs 200 off-topic tokens -->
  <text x="40" y="30" font-size="13" fill="#555">vs. 200 off-topic tokens</text>
  <rect x="40" y="40" width="300" height="50" fill="#b23b3b" stroke="#8a1f1f"/>
  <rect x="340" y="40" width="80" height="50" fill="url(#manyTokensD)" stroke="#ccc"/>
  <text x="190" y="70" text-anchor="middle" font-size="12" fill="#fff">relevant token</text>
  <text x="380" y="110" text-anchor="middle" font-size="10.5" fill="#999">200 off-topic</text>

  <!-- Panel B: relevant token vs 3 near-duplicates -->
  <text x="480" y="30" font-size="13" fill="#555">vs. 3 near-duplicates</text>
  <rect x="480" y="40" width="95" height="50" fill="#b23b3b" stroke="#8a1f1f"/>
  <rect x="575" y="40" width="95" height="50" fill="#e8a894" stroke="#c97a63"/>
  <rect x="670" y="40" width="95" height="50" fill="#e8a894" stroke="#c97a63"/>
  <rect x="765" y="40" width="95" height="50" fill="#e8a894" stroke="#c97a63"/>
  <text x="527" y="70" text-anchor="middle" font-size="11" fill="#fff">relevant</text>
  <text x="812" y="110" text-anchor="middle" font-size="10.5" fill="#a35b47">3 near-copies of it</text>
</svg>
