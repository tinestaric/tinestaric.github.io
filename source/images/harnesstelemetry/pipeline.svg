<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 0 1070 250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ms-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9ac7a"/>
    </marker>
  </defs>
  <!-- harnesses -->
  <rect x="20" y="40" width="190" height="60" rx="10" fill="#c9dcf5" stroke="#5b84c4" stroke-width="1.5"/>
  <text x="115" y="66" text-anchor="middle" font-size="15" fill="#1a1a1a">Claude Code</text>
  <text x="115" y="86" text-anchor="middle" font-size="11.5" fill="#555">metrics + events</text>
  <rect x="20" y="130" width="190" height="60" rx="10" fill="#c9dcf5" stroke="#5b84c4" stroke-width="1.5"/>
  <text x="115" y="156" text-anchor="middle" font-size="15" fill="#1a1a1a">GitHub Copilot</text>
  <text x="115" y="176" text-anchor="middle" font-size="11.5" fill="#555">traces + metrics</text>

  <!-- arrows to collector -->
  <path d="M210 70 L300 100" stroke="#777" stroke-width="1.5" fill="none"/>
  <path d="M210 160 L300 130" stroke="#777" stroke-width="1.5" fill="none"/>
  <text x="255" y="58" text-anchor="middle" font-size="11" fill="#555">OTLP + token</text>

  <!-- collector -->
  <rect x="300" y="50" width="270" height="140" rx="10" fill="#fafafa" stroke="#c99a3f" stroke-width="1.5"/>
  <text x="435" y="76" text-anchor="middle" font-size="15" fill="#1a1a1a">Your collector</text>
  <text x="435" y="102" text-anchor="middle" font-size="12.5" fill="#333">1. check the ingest token</text>
  <text x="435" y="124" text-anchor="middle" font-size="12.5" fill="#333">2. keep only the allowlist</text>
  <text x="435" y="146" text-anchor="middle" font-size="12.5" fill="#333">3. hash identity, delete content</text>
  <text x="435" y="168" text-anchor="middle" font-size="12.5" fill="#333">4. export with the connection string</text>

  <path d="M570 120 L650 120" stroke="#777" stroke-width="1.5" fill="none"/>

  <!-- app insights -->
  <rect x="650" y="90" width="170" height="60" rx="10" fill="#e4e4e4" stroke="#999" stroke-width="1.5"/>
  <text x="735" y="116" text-anchor="middle" font-size="15" fill="#1a1a1a">Application</text>
  <text x="735" y="134" text-anchor="middle" font-size="15" fill="#1a1a1a">Insights</text>

  <path d="M820 120 L890 120" stroke="#777" stroke-width="1.5" fill="none"/>

  <!-- dashboard -->
  <rect x="890" y="90" width="140" height="60" rx="10" fill="#e4e4e4" stroke="#999" stroke-width="1.5"/>
  <text x="960" y="116" text-anchor="middle" font-size="15" fill="#1a1a1a">Workbook</text>
  <text x="960" y="134" text-anchor="middle" font-size="15" fill="#1a1a1a">or Grafana</text>

  <!-- managed settings -->
  <rect x="20" y="212" width="190" height="28" rx="14" fill="#efe3d3" stroke="#c9ac7a" stroke-dasharray="3 2"/>
  <text x="115" y="231" text-anchor="middle" font-size="11.5" fill="#7a6746">managed settings configure both</text>
  <path d="M115 212 L115 192" stroke="#c9ac7a" stroke-width="1.5" stroke-dasharray="3 2" fill="none" marker-end="url(#ms-arrow)"/>
  <path d="M20 226 L2 226 L2 70 L18 70" stroke="#c9ac7a" stroke-width="1.5" stroke-dasharray="3 2" fill="none" marker-end="url(#ms-arrow)"/>
</svg>
